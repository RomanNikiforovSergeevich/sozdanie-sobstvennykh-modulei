---
- name: Update apt cache ignoring GPG errors (Debian)
  ansible.builtin.command: apt-get update --allow-insecure-repositories
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Install prerequisite packages (Debian)
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
      - python3-apt
    state: present
    allow_unauthenticated: true
    update_cache: false
  when: ansible_os_family == "Debian"

- name: Download Datadog GPG key (Debian)
  ansible.builtin.get_url:
    url: https://keys.datadoghq.com/DATADOG_APT_KEY_CURRENT.public
    dest: /tmp/DATADOG_APT_KEY_CURRENT.public
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Add Datadog GPG key (Debian)
  ansible.builtin.apt_key:
    file: /tmp/DATADOG_APT_KEY_CURRENT.public
    state: present
  when: ansible_os_family == "Debian"

- name: Add Vector repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [trusted=yes] https://apt.vector.dev stable vector-0"
    state: present
    filename: vector
    update_cache: false
  when: ansible_os_family == "Debian"

- name: Update apt cache again after adding repo (Debian)
  ansible.builtin.command: apt-get update --allow-insecure-repositories
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Install Vector packages (Debian)
  ansible.builtin.apt:
    name: vector
    state: present
    allow_unauthenticated: true
    update_cache: false
  when: ansible_os_family == "Debian"

- name: Add Vector repository (RedHat)
  ansible.builtin.yum_repository:
    name: vector
    description: Vector Repo
    baseurl: https://yum.vector.dev/stable/vector-0/$basearch/
    gpgkey: https://keys.datadoghq.com/DATADOG_RPM_KEY_CURRENT.public
    gpgcheck: false
  when: ansible_os_family == "RedHat"

- name: Install Vector packages (RedHat)
  ansible.builtin.dnf:
    name: vector
    state: present
  when: ansible_os_family == "RedHat"

#- name: Ensure Vector data directory exists
#  ansible.builtin.file:
#    path: "{{ vector_data_dir }}"
#    state: directory
#    owner: vector
#    group: vector
#    mode: '0755'

- name: Create Vector configuration
  ansible.builtin.template:
    src: vector.yaml.j2
    dest: /etc/vector/vector.yaml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Vector

- name: Ensure Vector service is running
  ansible.builtin.systemd:
    name: vector
    state: started
    enabled: true
